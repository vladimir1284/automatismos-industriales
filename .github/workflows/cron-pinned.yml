name: cron-pinned

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call pinned job
        run: |
          curl -sf -X POST "https://telegram-bot-variantes.vladimir-7bb.workers.dev/jobs/pinned" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
